<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment | Jaes Nails Lab</title>

<link rel="stylesheet" href="booking.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">



</head>

<body>

<section class="booking">

<div class="booking-image">

<h1>Book Your Appointment</h1>

<p>
Luxury nail care designed to make you feel confident, elegant and beautiful.
</p>

</div>

<div class="booking-form">

<h2>Appointment Form</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<input type="email" id="email" placeholder="Email Address">

<input type="date" id="date" required>

<input type="time" id="time" required>

<select id="service">

<option>Acrylic Nails</option>

<option>BIAB Nails</option>

<option>Gel Polish</option>

<option>Nail Art</option>

<option>DoubleStick On Nails</option>

<option>Single Stick On Nails</option>

</select>

<select id="length">

<option>Short</option>

<option>Medium</option>

<option>Long</option>

<option>Extra Long</option>

</select>

<textarea id="notes" rows="5" placeholder="Additional Notes"></textarea>

<button type="submit">

Book Appointment

</button>

</form>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
